name: ci
on:
  push:
  pull_request:

jobs:
  regress:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17]
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL ${{ matrix.pg }}
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $VERSION_CODENAME-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-${{ matrix.pg }} postgresql-server-dev-${{ matrix.pg }}
      - name: Build, install, test
        run: |
          PGBIN=/usr/lib/postgresql/${{ matrix.pg }}/bin
          MK="make PG_CONFIG=$PGBIN/pg_config"
          sudo $MK install

          # private throwaway cluster owned by the runner user
          $PGBIN/initdb -D "$RUNNER_TEMP/pgdata" -U postgres -A trust >/dev/null
          $PGBIN/pg_ctl -D "$RUNNER_TEMP/pgdata" -l "$RUNNER_TEMP/pg.log" -w \
            -o "-p 55432 -k /tmp -c listen_addresses=''" start

          $MK installcheck PGHOST=/tmp PGPORT=55432 PGUSER=postgres
      - name: Show diffs on failure
        if: failure()
        run: |
          cat regression.diffs 2>/dev/null || true
          cat "$RUNNER_TEMP/pg.log" 2>/dev/null | tail -50 || true
